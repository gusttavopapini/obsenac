<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="PCGPA – Plataforma de Continuidade e Gestão de Projetos Acadêmicos. Gerencie, acompanhe e dê continuidade a projetos de pesquisa e extensão." />
  <title>PCGPA – Plataforma de Gestão de Projetos Acadêmicos</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets (ordem importa) -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/reset.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>

  <!-- =============================================
       TOAST / NOTIFICAÇÕES
  ============================================= -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- =============================================
       MODAL GLOBAL
  ============================================= -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box" id="modal-box">
      <button class="modal-close" id="modal-close-btn" aria-label="Fechar modal">&times;</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- =============================================
       APP ROOT — SPA renderiza aqui
  ============================================= -->
  <div id="app">

    <!-- ── NAVBAR (visível só quando logado) ─────────────────── -->
    <nav class="navbar hidden" id="navbar">
      <div class="nav-brand">
        <span class="nav-logo-icon">🎓</span>
        <span class="nav-brand-name">PCGPA</span>
      </div>
      <ul class="nav-links" id="nav-links">
        <!-- preenchido pelo router -->
      </ul>
      <div class="nav-actions">
        <div class="nav-user" id="nav-user">
          <div class="nav-avatar" id="nav-avatar">A</div>
          <span class="nav-username" id="nav-username">Usuário</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logout-btn">Sair</button>
        <button class="hamburger" id="hamburger-btn" aria-label="Menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- ── VIEWS (apenas uma visível por vez) ─────────────────── -->
    <main id="view-root"></main>

  </div><!-- /#app -->

  <!-- =============================================
       MÓDULOS JS (ES6 modules via type="module")
  ============================================= -->
  <script type="module" src="js/app.js"></script>

</body>
</html>
